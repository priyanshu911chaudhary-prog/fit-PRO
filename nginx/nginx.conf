
events {
    worker_connections 1024;
}

http {
    log_format upstreamlog
        'client=$remote_addr request="$request" '
        'status=$status upstream=$upstream_addr '
        'upstream_status=$upstream_status '
        'response_time=$request_time';

    access_log /dev/stdout upstreamlog;

    client_max_body_size 10M;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream nextjs_apps {
        least_conn;

        server app1:3000 max_fails=3 fail_timeout=10s;
        server app2:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;

        # Health check probe for edge load balancers
        location = /api/health {
            proxy_pass http://nextjs_apps;
            proxy_http_version 1.1;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SSE & Real-time AI Coach streaming (disables buffering for immediate chunk delivery)
        location ~* ^/api/(coach|ai/) {
            proxy_pass http://nextjs_apps;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable proxy buffering for Server-Sent Events (SSE)
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            chunked_transfer_encoding on;
        }

        # General application pages and static assets
        location / {
            proxy_pass http://nextjs_apps;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
